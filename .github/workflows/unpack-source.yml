name: Inspect Bharatgas package

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack application
        run: |
          rm -rf app_source
          mkdir -p app_source
          unzip -o "gaswallet_production (1).zip" -d app_source
          find app_source -type f | sort | head -300 > app_source_file_list.txt
      - name: Commit unpacked source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_source app_source_file_list.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: unpack Bharatgas application for bug fixing"
          git push
